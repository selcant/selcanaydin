        aria-label: Google Scholar
      - icon: linkedin
        href: https://www.linkedin.com/in/selcanayd/
        aria-label: LinkedIn
      - icon: bluesky
        href: https://bsky.app/profile/selcan.bsky.social
        aria-label: Bluesky
      - icon: envelope
        href: mailto:selcan.aydin@jax.org
        aria-label: Email
    right:
      - text: "Contact"
