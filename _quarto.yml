      © 2025 Selcan Aydin ·
      Made with [Quarto](https://quarto.org) ·
      [License](/license.qmd)
    center:
      - icon: github
        href: https://github.com/selcant
        aria-label: GitHub
      - text: "{{< iconify academicons orcid >}}"
        href: https://orcid.org/0000-0002-0457-9641
        aria-label: Orcid
      - text: "{{< iconify academicons google-scholar >}}"
